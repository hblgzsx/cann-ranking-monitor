name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Assemble static site
        run: |
          mkdir -p _site/lib _site/data
          cp team-prefixes.css tbest.html tbest.css tbest.mjs index.html submissions.html team.html style.css submissions.css team-analysis.css app.mjs submissions.mjs team.mjs favicon.svg data-source.json _site/
          cp lib/scoring.mjs lib/analytics.mjs lib/analysis-ui.mjs lib/feed.mjs lib/submissions.mjs lib/team-report.mjs lib/live-data.mjs lib/icons.mjs lib/team-analysis-ui.mjs lib/tbest-history.mjs lib/tbest-analysis.mjs lib/team-prefixes.mjs lib/team-prefix-ui.mjs lib/region-manager.mjs lib/network.mjs _site/lib/
          cp data/latest.json _site/data/
          cp lib/snapshot-store.mjs _site/lib/
          touch _site/.nojekyll
      - name: Prepare current same-origin fallback snapshot
        run: node scripts/publish-mobile-snapshot.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
