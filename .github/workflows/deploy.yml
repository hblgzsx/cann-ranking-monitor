name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: npm test
      - name: Assemble static site
        run: |
          mkdir -p _site/lib _site/data
          cp index.html submissions.html team.html style.css submissions.css app.mjs submissions.mjs team.mjs favicon.svg data-source.json _site/
          cp lib/scoring.mjs lib/analytics.mjs lib/analysis-ui.mjs lib/feed.mjs lib/submissions.mjs lib/team-report.mjs lib/live-data.mjs _site/lib/
          cp data/latest.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
