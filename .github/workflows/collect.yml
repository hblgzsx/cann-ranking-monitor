name: Collect public ranking
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: '运行分钟数，0 表示仅采集一次；定时任务每轮约 4 分钟'
        default: '4'
        required: false
permissions:
  contents: write
concurrency:
  group: ranking-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: data
          path: .state
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Capture and publish every minute (short rolling run)
        env:
          DURATION_MINUTES: ${{ inputs.duration || '4' }}
        run: node scripts/worker.mjs
